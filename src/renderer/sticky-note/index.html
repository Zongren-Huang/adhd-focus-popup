<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Sticky Note</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff6a8;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  .task {
    padding: 16px 16px 8px;
    font-size: 16px;
    line-height: 1.4;
    color: #3a3a1f;
  }
  .empty-state {
    padding: 16px;
    font-size: 14px;
    color: #3a3a1f;
  }
  button {
    -webkit-app-region: no-drag;
    margin: 0 16px 12px;
  }
</style>
</head>
<body>
  <div class="task-view" id="task-view" hidden>
    <div class="task" id="task-text"></div>
    <button id="mark-done-button">Mark Done</button>
  </div>
  <div class="empty-state" id="empty-state" hidden>
    <p>No Current Task.</p>
    <button id="add-task-button">Add a Task</button>
  </div>
  <script src="./app.js"></script>
</body>
</html>
