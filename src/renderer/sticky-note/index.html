<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Sticky Note</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff6a8;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  .task {
    padding: 16px;
    font-size: 16px;
    line-height: 1.4;
    color: #3a3a1f;
  }
</style>
</head>
<body>
  <div class="task" id="task"></div>
  <script>
    document.getElementById("task").textContent = window.stickyNote.taskText;
  </script>
</body>
</html>
