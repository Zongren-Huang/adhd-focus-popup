<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Sticky Note</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff6a8;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  .task-context {
    padding: 0 16px;
    font-size: 11px;
    line-height: 1.3;
    color: #3a3a1f;
    opacity: 0.55;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #previous-task {
    text-decoration: line-through;
    padding-top: 8px;
  }
  #upcoming-task {
    padding-bottom: 4px;
  }
  .task {
    padding: 4px 16px 8px;
    font-size: 16px;
    line-height: 1.4;
    color: #3a3a1f;
  }
  .empty-state {
    padding: 16px;
    font-size: 14px;
    color: #3a3a1f;
  }
  .actions {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
  }
  button {
    -webkit-app-region: no-drag;
    margin: 0;
  }
  #snooze-button:disabled {
    opacity: 0.6;
  }
  .reminder-toggle-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px 10px;
    -webkit-app-region: no-drag;
  }
  .reminder-toggle-caption {
    font-size: 12px;
    color: #3a3a1f;
  }
  #add-task-button {
    margin-left: auto;
    padding: 3px 8px;
    font-size: 12px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 32px;
    height: 18px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #b3aa66;
    transition: 0.15s;
    border-radius: 18px;
  }
  .switch-slider::before {
    position: absolute;
    content: "";
    height: 14px;
    width: 14px;
    left: 2px;
    bottom: 2px;
    background-color: #fff;
    transition: 0.15s;
    border-radius: 50%;
  }
  .switch input:checked + .switch-slider {
    background-color: #4caf50;
  }
  .switch input:checked + .switch-slider::before {
    transform: translateX(14px);
  }
  #reminder-off-status {
    margin: 0;
    padding: 4px 16px 0;
    font-size: 12px;
    font-weight: bold;
    color: #a00;
  }
  @keyframes reminder-flash {
    0%, 100% { background-color: #fff6a8; }
    50% { background-color: #ff5c5c; }
  }
  body.reminder-flash {
    animation: reminder-flash 0.3s ease-in-out 2;
  }
</style>
</head>
<body>
  <div class="task-view" id="task-view" hidden>
    <div class="task-context" id="previous-task" hidden></div>
    <div class="task" id="task-text"></div>
    <div class="task-context" id="upcoming-task" hidden></div>
    <div class="actions">
      <button id="mark-done-button">Mark Done</button>
      <button id="snooze-button">Snooze</button>
    </div>
  </div>
  <div class="empty-state" id="empty-state" hidden>
    <p id="empty-state-message">No Current Task.</p>
  </div>
  <p id="reminder-off-status" hidden>Reminder is currently off</p>
  <div class="reminder-toggle-row">
    <label class="switch">
      <input type="checkbox" id="reminder-toggle" checked />
      <span class="switch-slider"></span>
    </label>
    <span class="reminder-toggle-caption">Reminders</span>
    <button id="add-task-button">+ Task</button>
  </div>
  <script src="./app.js"></script>
</body>
</html>
