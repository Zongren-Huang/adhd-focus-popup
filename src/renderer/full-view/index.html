<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Full View</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #fafafa;
    color: #222;
  }
  .full-view {
    padding: 24px;
  }
  #add-task-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #add-task-input {
    flex: 1;
    padding: 8px;
    font-size: 14px;
  }
  #task-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #task-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: grab;
  }
  #task-list li.done span {
    text-decoration: line-through;
    color: #888;
  }
  #task-list li span {
    flex: 1;
  }
  h2 {
    font-size: 16px;
    margin: 32px 0 12px;
  }
  #settings-form {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 16px;
  }
  #settings-form label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
  }
  #settings-form input {
    width: 80px;
    padding: 6px;
    font-size: 14px;
  }
  #voice-profile-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 16px;
    max-width: 420px;
  }
  #voice-profile-form label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    width: 100%;
  }
  #voice-profile-name-input {
    padding: 6px;
    font-size: 14px;
  }
  #nag-clip-preview {
    width: 100%;
  }
  #record-status {
    font-size: 12px;
    color: #a00;
  }
</style>
</head>
<body>
  <div class="full-view">
    <h1>Full View</h1>
    <form id="add-task-form">
      <input id="add-task-input" type="text" placeholder="Add a task..." autocomplete="off" required />
      <button type="submit">Add Task</button>
    </form>
    <ul id="task-list"></ul>

    <h2>Reminder Settings</h2>
    <form id="settings-form">
      <label>
        Idle threshold (minutes)
        <input id="idle-threshold-input" type="number" min="1" required />
      </label>
      <label>
        Repeat interval (minutes)
        <input id="repeat-interval-input" type="number" min="1" required />
      </label>
      <label>
        Default snooze duration (minutes)
        <input id="default-snooze-input" type="number" min="1" required />
      </label>
      <button type="submit">Save Settings</button>
    </form>

    <h2>Voice Profile</h2>
    <form id="voice-profile-form">
      <label>
        Name
        <input id="voice-profile-name-input" type="text" required />
      </label>
      <button type="button" id="record-toggle-button">Start Recording</button>
      <span id="record-status"></span>
      <label>
        Or upload a file
        <input id="nag-clip-file-input" type="file" accept="audio/*" />
      </label>
      <audio id="nag-clip-preview" controls hidden></audio>
      <button type="submit" id="save-voice-profile-button" disabled>Save Voice Profile</button>
    </form>
  </div>
  <script src="./app.js"></script>
</body>
</html>
