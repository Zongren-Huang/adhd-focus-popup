<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Settings</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #fafafa;
    color: #222;
  }
  .full-view {
    padding: 24px;
  }
  #add-task-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #add-task-input {
    flex: 1;
    padding: 8px;
    font-size: 14px;
  }
  #task-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #task-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: grab;
  }
  #task-list li.done > span:first-child {
    text-decoration: line-through;
    color: #888;
  }
  #task-list li > span:first-child {
    flex: 1;
  }
  h2 {
    font-size: 16px;
    margin: 32px 0 12px;
  }
  #settings-form {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 16px;
  }
  #settings-form label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
  }
  .field-with-help {
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  #settings-form input {
    width: 80px;
    padding: 6px;
    font-size: 14px;
  }
  #voice-profile-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 16px;
    max-width: 420px;
  }
  #voice-profile-form label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
    width: 100%;
  }
  #voice-profile-name-input {
    padding: 6px;
    font-size: 14px;
  }
  #nag-clip-preview {
    width: 100%;
  }
  #record-status {
    font-size: 12px;
    color: #a00;
  }
  #voice-profile-list {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
    max-width: 480px;
  }
  #voice-profile-list li {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    margin-bottom: 8px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
  }
  .voice-profile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-weight: bold;
  }
  .active-badge {
    font-size: 12px;
    font-weight: normal;
    color: #2a7a2a;
  }
  .record-toggle-button {
    min-width: 120px;
    text-align: center;
  }
  .ack-clip-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    background: #fafafa;
    border: 1px solid #eaeaea;
    border-radius: 4px;
  }
  .ack-clip-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  .ack-clip-body {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
  }
  .ack-clip-player {
    display: flex;
    align-items: center;
    min-width: 180px;
    min-height: 32px;
  }
  .ack-clip-player audio {
    width: 180px;
  }
  .no-clip-text {
    font-size: 12px;
    font-style: italic;
    color: #888;
  }
  .ack-clip-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ack-clip-actions #record-status,
  .ack-clip-actions .record-status {
    font-size: 12px;
    color: #a00;
  }
  .help-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #888;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    user-select: none;
  }
  .help-popover {
    position: fixed;
    z-index: 1000;
    max-width: 240px;
    padding: 8px 10px;
    background: #333;
    color: #fff;
    font-size: 12px;
    font-weight: normal;
    line-height: 1.4;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  .list-hint {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 4px 0 8px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>
  <div class="full-view">
    <h1>Settings</h1>
    <form id="add-task-form">
      <input id="add-task-input" type="text" placeholder="Add a task..." autocomplete="off" required />
      <button type="submit">Add Task</button>
    </form>
    <div class="list-hint">
      <span>Drag tasks to reorder</span>
    </div>
    <ul id="task-list"></ul>

    <h2>Reminder Settings</h2>
    <form id="settings-form">
      <div class="field-with-help">
        <label>
          Idle threshold (minutes)
          <input id="idle-threshold-input" type="number" min="1" required />
        </label>
        <span class="help-icon" data-help="How many minutes of no keyboard or mouse activity before a Reminder starts.">?</span>
      </div>
      <div class="field-with-help">
        <label>
          Reminder duration (minutes)
          <input id="reminder-duration-input" type="number" min="1" required />
        </label>
        <span class="help-icon" data-help="How many minutes to keep reminding you before automatically turning reminders off.">?</span>
      </div>
      <div class="field-with-help">
        <label>
          Default snooze duration (minutes)
          <input id="default-snooze-input" type="number" min="1" required />
        </label>
        <span class="help-icon" data-help="How long the Snooze button silences reminders for, in minutes.">?</span>
      </div>
      <button type="submit">Save Settings</button>
    </form>

    <h2>Voice Profiles</h2>
    <form id="voice-profile-form">
      <label>
        <span>Name</span>
        <input id="voice-profile-name-input" type="text" required />
      </label>
      <button type="button" id="record-toggle-button" class="record-toggle-button">Start Recording</button>
      <span id="record-status"></span>
      <label>
        <span>Or upload a file</span>
        <input id="nag-clip-file-input" type="file" accept="audio/*" />
      </label>
      <audio id="nag-clip-preview" controls hidden></audio>
      <button type="submit" id="save-voice-profile-button" disabled>Create Voice Profile</button>
    </form>
    <ul id="voice-profile-list"></ul>
  </div>
  <script src="./app.js"></script>
</body>
</html>
